server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: payments-ledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Never wait forever for a row lock. A lock timeout (SQLSTATE 55P03) is treated as a
      # transient failure and the business transaction is retried.
      connection-init-sql: "SET lock_timeout = '10s'"

  jpa:
    # Open-Session-In-View keeps one EntityManager for the whole HTTP request. We turn it off so
    # every (retried) transaction gets a fresh persistence context and never sees stale entities.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or alters tables.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      accept-case-insensitive-enums: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Fail fast when Kafka is down so the outbox relay doesn't hold its DB locks for a minute.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 5
    consumer:
      group-id: webhook-dispatcher
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit the offset of each record only after the listener returned successfully,
      # i.e. after the webhook_deliveries rows were committed to PostgreSQL.
      ack-mode: record
    admin:
      fail-fast: false

  task:
    scheduling:
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ledger:
  security:
    # Development key only. Override with the LEDGER_API_KEY environment variable in any shared environment.
    api-keys:
      - key: ${LEDGER_API_KEY:sk_test_local_dev_key}
        client-id: ${LEDGER_CLIENT_ID:local-dev}
        admin: true
  fees:
    # 2.9% + 30 minor units. 290 basis points = 2.90%.
    percent-bps: 290
    fixed-minor: 30
  idempotency:
    lock-timeout: 30s
    retention: 24h
    cleanup-interval-ms: 3600000
  transactions:
    max-retries: 3
    base-backoff: 20ms
  outbox:
    enabled: true
    relay-interval-ms: 200
    batch-size: 100
    send-timeout: 10s
  kafka:
    events-topic: ledger.events
    dlq-topic: ledger.events.dlq
    partitions: 3
    replication-factor: 1
  webhooks:
    dispatcher-enabled: true
    consumer-group: webhook-dispatcher
    deliver-inline: true
    request-timeout: 5s
    retry-schedule: 10s,30s,2m,10m,30m,1h
    jitter-ratio: 0.2
    retry-poll-interval-ms: 1000
    batch-size: 50
    claim-lease: 60s
